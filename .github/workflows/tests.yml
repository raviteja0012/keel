name: tests

# The risk-rail and circuit-breaker suites are the code that must not fail
# (CLAUDE.md safety invariants). Run them on every push and PR so a rail can
# never be weakened silently.

on:
  push:
    branches: [main, dev]  # dev is the integration branch: work lands there
  pull_request:            # first, so it has to be verified there too. Feature
  workflow_dispatch:       # branches are covered by pull_request.

permissions:
  contents: read

concurrency:             # a newer commit supersedes an in-flight run
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: trading-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: trading-bot/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      # Discovered, not listed. This step used to name seven files by hand, and
      # eight others — including every broker-adapter suite — were therefore
      # never run in CI. Adding a test file is not supposed to be a two-part
      # job where forgetting the second part fails silently and looks green.
      #
      # Each file is run in its own process on purpose: they are scripts, not
      # pytest modules, and several set TRADING_DB at import time.
      - name: Every test suite in tests/
        run: |
          set -u
          failed=""
          shopt -s nullglob
          for f in tests/test_*.py; do
            echo "::group::$f"
            if python "$f"; then echo "PASS $f"; else failed="$failed $f"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failing suites:$failed"
            exit 1
          fi
          echo "all suites passed"

      - name: Compile-check every module
        run: python -m compileall -q . ../hallucination_check.py
